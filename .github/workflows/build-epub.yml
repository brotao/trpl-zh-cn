name: Build EPUB

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'epub-builder/**'
      - 'epub.css'
      - 'ferris.css'
      - '.github/workflows/build-epub.yml'
  workflow_dispatch: # 允许在 GitHub 页面手动触发构建

jobs:
  build-epub:
    name: Build and Package EPUB
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Pandoc & Chinese fonts)
        run: |
          sudo apt-get update
          # 安装 pandoc 用于底层转换，安装中文字体确保 EPUB 渲染正常
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存 epub-builder 的依赖，加速后续构建
          workspaces: "epub-builder"

      - name: Build EPUB using project's Rust builder
        run: |
          echo "Starting EPUB build process..."
          cargo run --release --manifest-path epub-builder/Cargo.toml

      - name: Verify EPUB generation
        run: |
          if [ ! -f "rust_programming_language.epub" ]; then
            echo "❌ Error: rust_programming_language.epub was not generated!"
            exit 1
          fi
          echo "✅ Successfully generated:"
          ls -lh rust_programming_language.epub

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_programming_language_zh-CN
          path: rust_programming_language.epub
          retention-days: 30 # 保留 30 天，也可根据需要调整
